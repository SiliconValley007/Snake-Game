<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="VIPER — a precise single-player snake arcade">
<title>VIPER</title>
<style>
:root{
  --bg:#070b14;--panel:rgba(10,16,28,.72);--line:#8a9bb8;--muted:#7b8ca8;
  --good:#22c55e;--good2:#7dffb0;--bad:#ff6b7a;--gold:#fbbf24;--ink:#e8edf7;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;background:var(--bg);color:var(--ink);
  font:600 15px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif;
  overflow:hidden;touch-action:none;user-select:none;overscroll-behavior:none;
}
body{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));
  background:
    radial-gradient(1200px 760px at 50% -10%,#173056 0%,transparent 58%),
    radial-gradient(800px 520px at 80% 110%,rgba(34,197,94,.08),transparent 50%),
    var(--bg);
}
#hud,#meta{
  width:min(100%,760px);display:flex;align-items:center;justify-content:space-between;
  letter-spacing:.16em;flex-shrink:0;
}
.stat{display:flex;flex-direction:column;gap:2px;min-width:76px}
.lbl{font-size:10px;color:var(--muted);text-transform:uppercase}
.val{
  font-size:22px;font-variant-numeric:tabular-nums;color:#f4f7ff;
  text-shadow:0 0 18px rgba(34,197,94,.35);transition:transform .18s var(--ease);
}
.val.pop{transform:scale(1.12)}
.right{text-align:right}
#pause{
  appearance:none;border:0;cursor:pointer;width:44px;height:44px;border-radius:12px;
  background:rgba(255,255,255,.06);color:#d7e4f5;display:grid;place-items:center;
  transition:transform .15s,background .15s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
}
#pause[hidden]{display:none!important}
#pause:hover{background:rgba(255,255,255,.1)}
#pause:active{transform:scale(.94)}
#pause:focus-visible,.chip:focus-visible,.cta:focus-visible,#pad button:focus-visible{
  outline:2px solid var(--good);outline-offset:3px;
}
#meta{color:var(--muted);font-size:11px;text-transform:uppercase;min-height:16px}
#cmb{color:var(--good2);min-height:1em}
#wrap{
  position:relative;width:min(100vw - 32px,100dvh - 196px,760px);aspect-ratio:1;max-width:100%;
}
canvas{
  display:block;width:100%;height:100%;border-radius:18px;
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 24px 80px rgba(0,0,0,.55),0 0 60px rgba(34,197,94,.08);
}
#ui{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:22px;background:var(--panel);backdrop-filter:blur(16px) saturate(1.2);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);border-radius:18px;z-index:3;
  border:1px solid rgba(255,255,255,.08);
  transition:opacity .22s var(--ease),visibility .22s var(--ease);
}
#ui.hide{opacity:0;visibility:hidden;pointer-events:none}
h1{
  font-size:clamp(36px,11vw,68px);letter-spacing:.28em;font-weight:800;margin:0 0 6px;
  background:linear-gradient(180deg,#fff,#9dffc4);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(34,197,94,.45));
}
#sub{color:var(--line);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:18px}
#tag{display:none;font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:8px;color:var(--bad)}
#tag.win{color:var(--good2)}
#msg{font-size:28px;margin:0 0 4px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
#detail{color:var(--line);font-size:13px;letter-spacing:.1em;margin-bottom:22px;min-height:18px}
.row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.chip,.cta{
  appearance:none;border:0;cursor:pointer;min-height:44px;border-radius:999px;
  font:700 12px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;
  transition:transform .15s,filter .15s,box-shadow .15s,background .15s,color .15s;
}
.chip{
  padding:0 16px;color:#c9d6ea;background:rgba(255,255,255,.06);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
}
.chip[aria-pressed="true"]{color:#06210f;background:linear-gradient(180deg,#7dffb0,#22c55e)}
.chip:hover,.cta:hover{filter:brightness(1.08)}
.chip:active,.cta:active{transform:scale(.96)}
.cta{
  min-width:176px;padding:14px 32px;color:#06210f;
  background:linear-gradient(180deg,#7dffb0,#22c55e);
  box-shadow:0 8px 28px rgba(34,197,94,.35),inset 0 1px 0 rgba(255,255,255,.35);
}
#pad{
  display:none;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;
  gap:10px;margin-top:2px;flex-shrink:0;
}
body.touch.run #pad{display:grid}
#pad button{
  appearance:none;border:0;cursor:pointer;width:52px;height:52px;border-radius:16px;
  background:rgba(255,255,255,.06);color:#d5e2f4;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);position:relative;overflow:hidden;
  touch-action:manipulation;
}
#pad button:active{transform:scale(.94);background:rgba(34,197,94,.28)}
#pad button.ripple::after{
  content:"";position:absolute;inset:18%;border-radius:50%;background:rgba(125,255,176,.45);
  animation:ripple .32s var(--ease) forwards;pointer-events:none;
}
@keyframes ripple{from{transform:scale(.4);opacity:.9}to{transform:scale(2.2);opacity:0}}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}
#pad .r{grid-column:3;grid-row:2}#pad .d{grid-column:2;grid-row:3}
#hint{color:#5b6b86;font-size:11px;letter-spacing:.16em;text-transform:uppercase;min-height:16px}
#flash{position:fixed;inset:0;pointer-events:none;z-index:4;background:var(--good);opacity:0}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (pointer:coarse){body.run #pad{display:grid}}
@media (max-height:560px){
  #sub,#hint,#meta{display:none}h1{font-size:32px}
  #wrap{width:min(100vw - 24px,100dvh - 108px)}
}
@media (orientation:landscape) and (max-height:500px){
  body{flex-direction:row;flex-wrap:wrap;gap:8px;padding:8px 12px}
  #hud,#meta,#hint{width:min(42vw,320px)}
  #wrap{width:min(100dvh - 24px,56vw);order:-1}
  #pad{margin:0}
}
@media (min-width:1100px){
  #wrap{width:min(100vw - 48px,100dvh - 200px,860px)}
  #hud,#meta{width:min(100%,860px)}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div id="live" aria-live="assertive"></div>
<div id="hud">
  <div class="stat"><span class="lbl">Score</span><span class="val" id="sc" aria-live="polite">0</span></div>
  <button id="pause" type="button" aria-label="Pause game" hidden>
    <svg id="pauseIcon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="1" width="4" height="14" rx="1" fill="currentColor"/><rect x="10" y="1" width="4" height="14" rx="1" fill="currentColor"/></svg>
  </button>
  <div class="stat right"><span class="lbl">Best</span><span class="val" id="hi">0</span></div>
</div>
<div id="meta"><span id="len">Len 3</span><span id="cmb"></span><span id="spd">Spd 1.0x</span></div>
<div id="wrap">
  <canvas id="c" role="img" aria-label="VIPER game board" tabindex="-1"></canvas>
  <div id="ui" role="dialog" aria-modal="true" aria-labelledby="tag msg">
    <div id="tag">Game Over</div>
    <h1>VIPER</h1>
    <div id="sub">Precision arcade snake</div>
    <div id="msg">Ready</div>
    <div id="detail">Swipe, pad, arrows or WASD</div>
    <div class="row" id="opts">
      <button class="chip" type="button" id="wrapBtn" aria-pressed="false">Wrap</button>
      <button class="chip" type="button" id="sndBtn" aria-pressed="true">Sound</button>
    </div>
    <button class="cta" id="btn" type="button">Play</button>
  </div>
</div>
<nav id="pad" aria-label="Direction pad">
  <button class="u" type="button" data-dx="0" data-dy="-1" aria-label="Up"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2l5 8H2z" fill="currentColor"/></svg></button>
  <button class="l" type="button" data-dx="-1" data-dy="0" aria-label="Left"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7l8-5v10z" fill="currentColor"/></svg></button>
  <button class="r" type="button" data-dx="1" data-dy="0" aria-label="Right"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M12 7L4 2v10z" fill="currentColor"/></svg></button>
  <button class="d" type="button" data-dx="0" data-dy="1" aria-label="Down"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 12L2 4h10z" fill="currentColor"/></svg></button>
</nav>
<div id="hint">Eat · Grow · Don't crash · Space pause · R restart</div>
<div id="flash" aria-hidden="true"></div>
<script>
(() => {
  'use strict';

  const N = 21;
  const BASE_TICK = 140;
  const MIN_TICK = 58;
  const SWIPE_PX = 30;
  const QUEUE_MAX = 2;
  const PART_CAP = 80;
  const FLOAT_CAP = 12;
  const COMBO_MS = 2400;
  const KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
  };
  const BLOCK = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar']);

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  if (!ctx) {
    document.getElementById('msg').textContent = 'Canvas unavailable';
    document.getElementById('detail').textContent = 'This browser cannot draw the board';
    document.getElementById('btn').disabled = true;
    return;
  }
  const UI = document.getElementById('ui');
  const BTN = document.getElementById('btn');
  const SC = document.getElementById('sc');
  const HI = document.getElementById('hi');
  const TAG = document.getElementById('tag');
  const MSG = document.getElementById('msg');
  const DET = document.getElementById('detail');
  const FL = document.getElementById('flash');
  const PAUSE = document.getElementById('pause');
  const LEN = document.getElementById('len');
  const SPD = document.getElementById('spd');
  const CMB = document.getElementById('cmb');
  const WRAPB = document.getElementById('wrapBtn');
  const SNDB = document.getElementById('sndBtn');
  const OPTS = document.getElementById('opts');
  const LIVE = document.getElementById('live');
  const PAD = document.getElementById('pad');
  const PAUSE_ICON = document.getElementById('pauseIcon');
  const ICON_PAUSE = '<rect x="2" y="1" width="4" height="14" rx="1" fill="currentColor"/><rect x="10" y="1" width="4" height="14" rx="1" fill="currentColor"/>';
  const ICON_PLAY = '<path d="M4 2.2v11.6L13.4 8z" fill="currentColor"/>';
  const reducedMq = matchMedia('(prefers-reduced-motion: reduce)');
  let reduced = reducedMq.matches;

  const eq = (a, b) => a[0] === b[0] && a[1] === b[1];
  const opp = (a, b) => a[0] === -b[0] && a[1] === -b[1];
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

  const Storage = {
    key: 'viper',
    load() {
      const out = { best: 0, wrap: false, sound: true };
      try {
        if (!window.localStorage) return out;
        const raw = localStorage.getItem(this.key);
        if (raw) {
          const s = JSON.parse(raw);
          out.best = Math.max(0, +s.best || 0);
          out.wrap = !!s.wrap;
          out.sound = s.sound !== false;
        }
        const legacy = +localStorage.getItem('viperBest');
        if (legacy > out.best) out.best = legacy;
      } catch (_) {}
      return out;
    },
    save(data) {
      try {
        if (!window.localStorage) return false;
        localStorage.setItem(this.key, JSON.stringify(data));
        return true;
      } catch (_) {
        return false;
      }
    }
  };

  const AudioFx = {
    ctx: null,
    ensure() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!this.ctx) this.ctx = new AC();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      } catch (_) {
        return null;
      }
    },
    beep(freq, dur, type, gain) {
      if (!state.soundOn) return;
      const ac = this.ensure();
      if (!ac) return;
      try {
        const o = ac.createOscillator();
        const v = ac.createGain();
        o.type = type || 'square';
        o.frequency.value = freq;
        v.gain.value = gain || 0.045;
        v.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
        o.connect(v);
        v.connect(ac.destination);
        o.start();
        o.stop(ac.currentTime + dur);
        o.addEventListener('ended', () => {
          o.disconnect();
          v.disconnect();
        });
      } catch (_) {}
    }
  };

  const saved = Storage.load();
  const state = {
    mode: 'idle',
    snake: [],
    prev: [],
    dir: [1, 0],
    queued: [],
    food: [0, 0],
    special: false,
    score: 0,
    combo: 0,
    maxCombo: 0,
    lastEat: 0,
    best: saved.best,
    wrapOn: saved.wrap,
    soundOn: saved.sound,
    tick: BASE_TICK,
    acc: 0,
    last: 0,
    eatFx: 0,
    eatCol: '#7dffb0',
    shake: 0,
    flash: 0,
    flashCol: '#22c55e'
  };

  const parts = [];
  const floats = [];
  const partPool = [];
  const floatPool = [];
  const occ = new Set();

  let cssSize = 1;
  let cell = 1;
  let dpr = 1;
  let rafId = 0;
  let ignoreSwipe = false;
  let swipe = null;
  const timers = new Set();
  const ripples = [];

  function later(fn, ms) {
    const id = window.setTimeout(() => {
      timers.delete(id);
      fn();
    }, ms);
    timers.add(id);
    return id;
  }

  function persist() {
    Storage.save({ best: state.best, wrap: state.wrapOn, sound: state.soundOn });
  }
  function setChip(el, on) {
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  function announce(text) {
    LIVE.textContent = text;
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    cssSize = Math.max(1, rect.width);
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const px = Math.max(1, Math.round(cssSize * dpr));
    if (canvas.width !== px || canvas.height !== px) {
      canvas.width = px;
      canvas.height = px;
    }
    cell = px / N;
  }

  function spawnFood() {
    occ.clear();
    for (let i = 0; i < state.snake.length; i++) {
      const p = state.snake[i];
      occ.add(p[0] + p[1] * N);
    }
    const free = N * N - occ.size;
    if (free <= 0) return false;
    let pick = (Math.random() * free) | 0;
    for (let i = 0; i < N * N; i++) {
      if (occ.has(i)) continue;
      if (pick === 0) {
        state.food = [i % N, (i / N) | 0];
        state.special = state.score >= 30 && Math.random() < 0.16;
        return true;
      }
      pick--;
    }
    return false;
  }

  function hud() {
    LEN.textContent = 'Len ' + state.snake.length;
    SPD.textContent = 'Spd ' + (BASE_TICK / state.tick).toFixed(1) + 'x';
    CMB.textContent = state.combo > 1 ? ('Combo x' + state.combo) : '';
  }

  function reset() {
    const m = N >> 1;
    state.snake = [[m, m], [m - 1, m], [m - 2, m]];
    state.prev = state.snake.map((p) => p.slice());
    state.dir = [1, 0];
    state.queued.length = 0;
    state.score = 0;
    state.combo = 0;
    state.maxCombo = 0;
    state.lastEat = 0;
    state.tick = BASE_TICK;
    state.acc = 0;
    state.eatFx = 0;
    state.shake = 0;
    state.special = false;
    recycleAll();
    spawnFood();
    SC.textContent = '0';
    hud();
  }

  function recycleAll() {
    while (parts.length) partPool.push(parts.pop());
    while (floats.length) floatPool.push(floats.pop());
  }

  function setDir(v) {
    if (!v || state.mode !== 'run') return;
    const lastD = state.queued.length ? state.queued[state.queued.length - 1] : state.dir;
    if (opp(lastD, v) || (lastD[0] === v[0] && lastD[1] === v[1])) return;
    if (state.queued.length < QUEUE_MAX) state.queued.push(v);
  }

  function burst(gx, gy, col, n) {
    if (reduced) return;
    n = Math.min(n, 28);
    for (let i = 0; i < n; i++) {
      const p = partPool.pop() || { gx: 0, gy: 0, vx: 0, vy: 0, life: 0, col: '' };
      const a = Math.PI * 2 * i / n + (Math.random() - 0.5) * 0.4;
      const sp = 1.1 + Math.random() * 2.6;
      p.gx = gx;
      p.gy = gy;
      p.vx = Math.cos(a) * sp;
      p.vy = Math.sin(a) * sp;
      p.life = 1;
      p.col = col;
      parts.push(p);
    }
    while (parts.length > PART_CAP) partPool.push(parts.shift());
  }

  function addFloat(gx, gy, txt, col) {
    const f = floatPool.pop() || { gx: 0, gy: 0, t: 0, txt: '', col: '' };
    f.gx = gx;
    f.gy = gy;
    f.t = 1;
    f.txt = txt;
    f.col = col;
    floats.push(f);
    while (floats.length > FLOAT_CAP) floatPool.push(floats.shift());
  }

  function popScore() {
    SC.classList.remove('pop');
    void SC.offsetWidth;
    SC.classList.add('pop');
  }

  function step() {
    state.prev = state.snake.map((p) => p.slice());
    if (state.queued.length) state.dir = state.queued.shift();
    const dir = state.dir;
    let hx = state.snake[0][0] + dir[0];
    let hy = state.snake[0][1] + dir[1];
    if (state.wrapOn) {
      hx = (hx + N) % N;
      hy = (hy + N) % N;
    } else if (hx < 0 || hy < 0 || hx >= N || hy >= N) {
      die();
      return;
    }
    const grow = hx === state.food[0] && hy === state.food[1];
    const end = grow ? state.snake.length : state.snake.length - 1;
    for (let i = 0; i < end; i++) {
      if (state.snake[i][0] === hx && state.snake[i][1] === hy) {
        die();
        return;
      }
    }
    state.snake.unshift([hx, hy]);
    if (grow) {
      const now = performance.now();
      const wasSpecial = state.special;
      const gain = wasSpecial ? 35 : 10;
      const fast = now - state.lastEat < COMBO_MS;
      state.combo = fast ? state.combo + 1 : 1;
      if (state.combo > state.maxCombo) state.maxCombo = state.combo;
      const add = gain + (state.combo > 1 ? (state.combo - 1) * 5 : 0);
      state.score += add;
      SC.textContent = String(state.score);
      popScore();
      state.tick = Math.max(MIN_TICK, state.tick - (wasSpecial ? 5.5 : 3.1));
      state.eatFx = 1;
      state.eatCol = wasSpecial ? '#fbbf24' : '#7dffb0';
      state.flash = wasSpecial ? 0.3 : 0.18;
      state.flashCol = wasSpecial ? '#fbbf24' : '#22c55e';
      FL.style.background = state.flashCol;
      state.lastEat = now;
      addFloat(hx + 0.5, hy + 0.2, '+' + add, wasSpecial ? '#fde68a' : '#7dffb0');
      burst(hx + 0.5, hy + 0.5, wasSpecial ? '#fbbf24' : '#7dffb0', wasSpecial ? 22 : 14);
      try { if (navigator.vibrate) navigator.vibrate(wasSpecial ? 18 : 10); } catch (_) {}
      AudioFx.beep(wasSpecial ? 880 : 660, 0.07, wasSpecial ? 'triangle' : 'square', 0.05);
      if (state.combo > 1) AudioFx.beep(990, 0.05, 'sine', 0.03);
      if (!spawnFood()) {
        win();
        return;
      }
      hud();
    } else {
      state.snake.pop();
    }
  }

  function overlay(mode, title, detail, cta) {
    state.mode = mode;
    PAUSE.hidden = mode === 'idle' || mode === 'over' || mode === 'win';
    document.body.classList.toggle('run', false);
    TAG.style.display = mode === 'idle' ? 'none' : 'block';
    TAG.className = mode === 'win' ? 'win' : '';
    TAG.textContent = title;
    MSG.textContent = mode === 'idle' ? 'Ready' : String(state.score);
    DET.textContent = detail;
    BTN.textContent = cta;
    OPTS.style.display = mode === 'idle' ? 'flex' : 'none';
    UI.classList.remove('hide');
    if (mode === 'pause') {
      PAUSE.hidden = false;
      PAUSE.setAttribute('aria-label', 'Resume game');
      PAUSE_ICON.innerHTML = ICON_PLAY;
    }
    BTN.focus();
  }

  function maybeBest() {
    if (state.score > state.best) {
      state.best = state.score;
      HI.textContent = String(state.best);
      persist();
      return true;
    }
    return false;
  }

  function die() {
    state.shake = reduced ? 0 : 0.5;
    state.flash = 0.38;
    state.flashCol = '#ff4d62';
    FL.style.background = '#ff4d62';
    burst(state.snake[0][0] + 0.5, state.snake[0][1] + 0.5, '#ff6b7a', 26);
    const isBest = maybeBest();
    AudioFx.beep(180, 0.22, 'sawtooth', 0.06);
    try { if (navigator.vibrate) navigator.vibrate([16, 40, 26]); } catch (_) {}
    const bits = [
      isBest ? 'New best' : ('Best ' + state.best),
      'Len ' + state.snake.length
    ];
    if (state.maxCombo > 1) bits.push('Combo x' + state.maxCombo);
    overlay('over', 'Game Over', bits.join(' · '), 'Again');
    announce('Game over. Score ' + state.score);
  }

  function win() {
    maybeBest();
    AudioFx.beep(520, 0.1, 'triangle', 0.05);
    later(() => AudioFx.beep(780, 0.18, 'triangle', 0.05), 90);
    overlay('win', 'Board cleared', 'Perfect run · ' + state.score, 'Again');
    announce('Board cleared. Score ' + state.score);
  }

  function play() {
    reset();
    state.mode = 'run';
    UI.classList.add('hide');
    PAUSE.hidden = false;
    PAUSE.setAttribute('aria-label', 'Pause game');
    PAUSE_ICON.innerHTML = ICON_PAUSE;
    document.body.classList.add('run');
    state.last = performance.now();
    state.acc = 0;
    AudioFx.beep(520, 0.06, 'square', 0.04);
    try { canvas.focus({ preventScroll: true }); } catch (_) {}
    announce('Game started');
  }

  function pause() {
    if (state.mode !== 'run') return;
    overlay('pause', 'Paused', 'Tap resume or press Space / Esc', 'Resume');
  }

  function resume() {
    if (state.mode !== 'pause') return;
    state.mode = 'run';
    UI.classList.add('hide');
    PAUSE.hidden = false;
    PAUSE.setAttribute('aria-label', 'Pause game');
    PAUSE_ICON.innerHTML = ICON_PAUSE;
    document.body.classList.add('run');
    state.last = performance.now();
    try { canvas.focus({ preventScroll: true }); } catch (_) {}
  }

  function pos(i, a) {
    const p = state.snake[i];
    const q = state.prev[i] || p;
    if (Math.abs(p[0] - q[0]) > 1 || Math.abs(p[1] - q[1]) > 1) {
      return [(p[0] + 0.5) * cell, (p[1] + 0.5) * cell];
    }
    return [(lerp(q[0], p[0], a) + 0.5) * cell, (lerp(q[1], p[1], a) + 0.5) * cell];
  }

  function draw(now) {
    const W = canvas.width;
    const g = ctx.createLinearGradient(0, 0, 0, W);
    g.addColorStop(0, '#10182a');
    g.addColorStop(1, '#0a101c');
    ctx.fillStyle = g;
    ctx.fillRect(-16, -16, W + 32, W + 32);

    ctx.strokeStyle = 'rgba(255,255,255,.034)';
    ctx.lineWidth = Math.max(1, dpr * 0.5);
    ctx.beginPath();
    for (let i = 1; i < N; i++) {
      ctx.moveTo(i * cell, 0);
      ctx.lineTo(i * cell, W);
      ctx.moveTo(0, i * cell);
      ctx.lineTo(W, i * cell);
    }
    ctx.stroke();

    const food = state.food;
    const pulse = reduced ? 0.5 : 0.5 + 0.5 * Math.sin(now / (state.special ? 160 : 240));
    const fx = (food[0] + 0.5) * cell;
    const fy = (food[1] + 0.5) * cell;
    const fr = cell * (0.26 + 0.07 * pulse);
    ctx.shadowColor = state.special ? '#fbbf24' : '#22c55e';
    ctx.shadowBlur = reduced ? 0 : 16 + 10 * pulse;
    ctx.fillStyle = state.special ? '#f59e0b' : '#4ade80';
    ctx.beginPath();
    ctx.arc(fx, fy, fr, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = state.special ? '#fff7d6' : '#d8ffe8';
    ctx.beginPath();
    ctx.arc(fx - fr * 0.22, fy - fr * 0.22, fr * 0.26, 0, Math.PI * 2);
    ctx.fill();

    const a = state.mode === 'run' ? clamp(state.acc / state.tick, 0, 1) : 1;
    const len = state.snake.length;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = len - 1; i > 0; i--) {
      const A = pos(i, a);
      const B = pos(i - 1, a);
      if (Math.hypot(A[0] - B[0], A[1] - B[1]) > cell * 1.7) continue;
      ctx.strokeStyle = 'hsl(' + (148 - i * 2.1) + ' 72% ' + (46 - i * 16 / len) + '%)';
      ctx.lineWidth = cell * (i === 1 ? 0.78 : 0.7);
      ctx.beginPath();
      ctx.moveTo(A[0], A[1]);
      ctx.lineTo(B[0], B[1]);
      ctx.stroke();
    }
    const H = pos(0, a);
    ctx.shadowColor = 'rgba(34,197,94,.85)';
    ctx.shadowBlur = reduced ? 0 : 16;
    ctx.fillStyle = '#ecffe8';
    ctx.beginPath();
    ctx.arc(H[0], H[1], cell * 0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#06210f';
    const ex = state.dir[0];
    const ey = state.dir[1];
    const off = cell * 0.15;
    ctx.beginPath();
    ctx.arc(H[0] - ey * off + ex * cell * 0.1, H[1] + ex * off + ey * cell * 0.1, cell * 0.07, 0, Math.PI * 2);
    ctx.arc(H[0] + ey * off + ex * cell * 0.1, H[1] - ex * off + ey * cell * 0.1, cell * 0.07, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(p.gx * cell, p.gy * cell, cell * 0.08 * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < floats.length; i++) {
      const f = floats[i];
      ctx.globalAlpha = f.t;
      ctx.fillStyle = f.col;
      ctx.font = '700 ' + ((cell * 0.42) | 0) + 'px ui-sans-serif,system-ui,sans-serif';
      ctx.fillText(f.txt, f.gx * cell, f.gy * cell);
    }
    ctx.globalAlpha = 1;

    if (state.eatFx > 0) {
      ctx.globalAlpha = state.eatFx * 0.32;
      ctx.strokeStyle = state.eatCol;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(fx, fy, cell * (0.42 + (1 - state.eatFx)), 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    const vg = ctx.createRadialGradient(W / 2, W / 2, W * 0.28, W / 2, W / 2, W * 0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.32)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, W);
  }

  function updateFx(dt) {
    const k = dt / 16.67;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.gx += p.vx * 0.055 * k;
      p.gy += p.vy * 0.055 * k;
      p.vy += 0.035 * k;
      p.life -= 0.03 * k;
      if (p.life <= 0) {
        partPool.push(parts[i]);
        parts.splice(i, 1);
      }
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.gy -= 0.02 * k;
      f.t -= 0.02 * k;
      if (f.t <= 0) {
        floatPool.push(floats[i]);
        floats.splice(i, 1);
      }
    }
    if (state.eatFx > 0) {
      state.eatFx = Math.max(0, state.eatFx - 0.055 * k);
    }
    if (state.shake > 0) {
      state.shake = Math.max(0, state.shake - dt * 0.0022);
    }
    if (state.flash > 0) {
      state.flash = Math.max(0, state.flash - dt * 0.004);
      FL.style.opacity = state.flash > 0 ? String(state.flash * 0.42) : '0';
    }
  }

  function loop(now) {
    rafId = requestAnimationFrame(loop);
    let dt = now - state.last;
    state.last = now;
    if (dt < 0) dt = 0;
    if (dt > 50) dt = 50;

    if (state.mode === 'run') {
      state.acc += dt;
      while (state.acc >= state.tick) {
        step();
        state.acc -= state.tick;
        if (state.mode !== 'run') break;
      }
    } else if (state.mode !== 'pause') {
      state.acc = state.tick;
    }

    updateFx(dt);

    const ox = !reduced && state.shake ? (Math.random() - 0.5) * state.shake * 10 : 0;
    const oy = !reduced && state.shake ? (Math.random() - 0.5) * state.shake * 10 : 0;
    ctx.setTransform(1, 0, 0, 1, ox, oy);
    draw(now);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function onPrimary() {
    if (state.mode === 'pause') resume();
    else if (state.mode !== 'run') play();
  }

  function onKey(e) {
    if (e.altKey || e.metaKey || e.ctrlKey) return;
    const onChip = !!(e.target && e.target.closest && e.target.closest('.chip'));
    if ((BLOCK.has(e.key) || e.code === 'Space') && !onChip) e.preventDefault();
    if (e.repeat && (e.code === 'Space' || e.key === 'Enter' || e.key === 'r' || e.key === 'R')) return;

    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      if (state.mode === 'run') pause();
      else if (state.mode === 'pause') resume();
      return;
    }
    if (e.code === 'Space') {
      if (onChip) return;
      if (state.mode === 'run') pause();
      else if (state.mode === 'pause') resume();
      else play();
      return;
    }
    if (e.key === 'r' || e.key === 'R') {
      if (state.mode !== 'idle') play();
      return;
    }
    const v = KEYS[e.key];
    if (v) {
      if (state.mode === 'idle' || state.mode === 'over' || state.mode === 'win') play();
      else if (state.mode === 'pause') resume();
      setDir(v);
    }
    if (e.key === 'Enter' && state.mode !== 'run') {
      if (e.target && e.target.closest && e.target.closest('button')) return;
      state.mode === 'pause' ? resume() : play();
    }
  }

  function onPad(e) {
    const b = e.target.closest('button');
    if (!b) return;
    ignoreSwipe = true;
    e.preventDefault();
    b.classList.remove('ripple');
    void b.offsetWidth;
    b.classList.add('ripple');
    ripples.push(b);
    later(() => {
      b.classList.remove('ripple');
      const ix = ripples.indexOf(b);
      if (ix >= 0) ripples.splice(ix, 1);
    }, 360);
    if (state.mode === 'pause') resume();
    if (state.mode !== 'run') play();
    setDir([+b.dataset.dx, +b.dataset.dy]);
  }

  function pointerOnUi(x, y) {
    const el = document.elementFromPoint(x, y);
    return !!(el && el.closest && el.closest('#ui, #pad, #pause, .chip, .cta'));
  }

  function onPointerDown(e) {
    if (e.pointerType === 'touch' || e.pointerType === 'pen') document.body.classList.add('touch');
    if (pointerOnUi(e.clientX, e.clientY)) {
      ignoreSwipe = true;
      return;
    }
    if (swipe) return;
    swipe = { id: e.pointerId, x: e.clientX, y: e.clientY };
  }

  function onPointerUp(e) {
    if (ignoreSwipe && (!swipe || swipe.id === e.pointerId)) {
      ignoreSwipe = false;
      swipe = null;
      return;
    }
    if (!swipe || swipe.id !== e.pointerId) return;
    const dx = e.clientX - swipe.x;
    const dy = e.clientY - swipe.y;
    swipe = null;
    if (Math.hypot(dx, dy) < SWIPE_PX) return;
    const v = Math.abs(dx) > Math.abs(dy) ? [dx > 0 ? 1 : -1, 0] : [0, dy > 0 ? 1 : -1];
    if (state.mode === 'idle' || state.mode === 'over' || state.mode === 'win') play();
    else if (state.mode === 'pause') resume();
    setDir(v);
  }

  function onPointerCancel(e) {
    if (swipe && swipe.id === e.pointerId) swipe = null;
    ignoreSwipe = false;
  }

  function onVisibility() {
    if (document.hidden && state.mode === 'run') pause();
  }
  function onBlur() {
    if (state.mode === 'run') pause();
  }

  const ac = new AbortController();
  const sig = { signal: ac.signal };

  BTN.addEventListener('click', onPrimary, sig);
  PAUSE.addEventListener('click', () => {
    state.mode === 'run' ? pause() : resume();
  }, sig);
  WRAPB.addEventListener('click', () => {
    state.wrapOn = !state.wrapOn;
    setChip(WRAPB, state.wrapOn);
    persist();
    DET.textContent = state.wrapOn ? 'Edges wrap around' : 'Crash on walls';
  }, sig);
  SNDB.addEventListener('click', () => {
    state.soundOn = !state.soundOn;
    setChip(SNDB, state.soundOn);
    persist();
    if (state.soundOn) AudioFx.beep(640, 0.06, 'square', 0.04);
  }, sig);
  PAD.addEventListener('pointerdown', onPad, { signal: ac.signal, passive: false });
  document.addEventListener('keydown', onKey, sig);
  document.addEventListener('pointerdown', onPointerDown, sig);
  document.addEventListener('pointerup', onPointerUp, sig);
  document.addEventListener('pointercancel', onPointerCancel, sig);
  document.addEventListener('visibilitychange', onVisibility, sig);
  window.addEventListener('blur', onBlur, sig);
  window.addEventListener('resize', resize, sig);
  if (window.visualViewport) visualViewport.addEventListener('resize', resize, sig);
  const onReduce = (e) => { reduced = e.matches; };
  if (reducedMq.addEventListener) reducedMq.addEventListener('change', onReduce, sig);
  else if (reducedMq.addListener) reducedMq.addListener(onReduce);
  if (navigator.maxTouchPoints > 0) document.body.classList.add('touch');

  window.addEventListener('pagehide', () => {
    ac.abort();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    timers.forEach((id) => clearTimeout(id));
    timers.clear();
    recycleAll();
    try { if (AudioFx.ctx && AudioFx.ctx.state !== 'closed') AudioFx.ctx.close(); } catch (_) {}
  }, { once: true });

  HI.textContent = String(state.best);
  setChip(WRAPB, state.wrapOn);
  setChip(SNDB, state.soundOn);
  resize();
  reset();
  rafId = requestAnimationFrame((t) => {
    state.last = t;
    loop(t);
  });
})();
</script>
</body>
</html>
